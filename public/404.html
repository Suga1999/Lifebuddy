<!doctype html>
<html lang="nl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0a0c12">
    <meta name="robots" content="noindex">
    <title>Pagina niet gevonden – LifeBuddy</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,500;14..32,700;14..32,800&display=swap" rel="stylesheet">
    <style>
        :root { color-scheme: dark; --ink: #f4f2ff; --muted: #aaa6c2; --accent: #a78bfa; }
        * { box-sizing: border-box; }
        body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; background: #0b0d12; color: var(--ink); font-family: Inter, system-ui, sans-serif; }
        main { width: min(100%, 570px); padding: clamp(32px, 8vw, 64px); border: 1px solid #272d3a; border-radius: 16px; background: #151922; text-align: center; }
        .mark { display: grid; width: 58px; height: 58px; place-items: center; margin: 0 auto 24px; border-radius: 14px; background: #202638; color: #d6ddff; font-size: 1.35rem; font-weight: 800; }
        p:first-of-type { margin: 0; color: var(--accent); font-size: .73rem; font-weight: 800; letter-spacing: .14em; }
        h1 { margin: 9px 0 12px; font-size: clamp(2rem, 6vw, 3.25rem); letter-spacing: -.06em; }
        p:last-of-type { max-width: 390px; margin: 0 auto; color: var(--muted); line-height: 1.65; }
        a { display: inline-flex; align-items: center; justify-content: center; min-height: 44px; margin-top: 28px; padding: 0 17px; border-radius: 9px; background: #6f7dfb; color: white; font-size: .85rem; font-weight: 800; text-decoration: none; }
        a:focus-visible { outline: 3px solid #ddd6fe; outline-offset: 4px; }
    </style>
</head>
<body>
    <main>
        <div class="mark" aria-hidden="true">LB</div>
        <p>FOUT 404</p>
        <h1>Deze pagina bestaat niet.</h1>
        <p>Misschien is de link verouderd, of staat deze pagina op een andere plek. Je kunt altijd veilig terug naar LifeBuddy.</p>
        <a href="/">Terug naar LifeBuddy</a>
    </main>
</body>
</html>
